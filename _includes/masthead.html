<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about-me"><span data-language-text="en">Homepage</span><span data-language-text="zh" hidden>主页</span></a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a data-language-link="true" data-url-en="{{ domain }}{{ link.url }}" data-url-zh="{{ domain }}{{ link.url_zh | default: link.url }}" href="{{ domain }}{{ link.url }}"><span data-language-text="en">{{ link.title }}</span><span data-language-text="zh" hidden>{{ link.title_zh }}</span></a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      <div class="language-switcher" role="group" aria-label="Language">
        <button type="button" class="language-switcher__button is-active" data-language="en" aria-pressed="true">EN</button>
        <span class="language-switcher__separator" aria-hidden="true">/</span>
        <button type="button" class="language-switcher__button" data-language="zh" aria-pressed="false">中文</button>
      </div>
    </div>
  </div>
</div>
